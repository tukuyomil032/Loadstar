name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install quality tools
        run: brew install swiftlint swift-format

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Run SwiftFormat lint
        run: swift-format lint --recursive Loadstar/ Tests/

      - name: Run SwiftLint
        run: swiftlint lint

      - name: Build Swift packages
        run: swift build

      - name: Build Debug app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project LoadStar.xcodeproj \
            -scheme LoadStar \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='arm64 x86_64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/ci-build.log

      - name: Verify Debug app
        shell: bash
        run: |
          set -euo pipefail
          build_settings="$(xcodebuild \
            -project LoadStar.xcodeproj \
            -scheme LoadStar \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='arm64 x86_64' \
            -showBuildSettings 2>/dev/null)"
          built_products_dir="$(printf '%s\n' "$build_settings" | grep -m 1 '^[[:space:]]*BUILT_PRODUCTS_DIR = ' | awk -F' = ' '{ print $2 }')"
          app_path="${built_products_dir}/LoadStar.app"
          binary_path="${app_path}/Contents/MacOS/LoadStar"
          test -d "$app_path"
          test -x "$binary_path"
          printf '%s\n' "$build_settings" | grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.tukuyomi032.loadstar.debug'
          lipo -info "$binary_path" | tee build/ci-lipo.txt
          grep -q 'arm64' build/ci-lipo.txt
          grep -q 'x86_64' build/ci-lipo.txt

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-diagnostics
          path: build/
